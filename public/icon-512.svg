    <!-- Heart Doorway in House -->
    <path d="M192 318 C192 318 140 280 140 240 C140 216 158 198 180 198 C192 198 202 204 208 212 C214 204 224 198 236 198 C258 198 276 216 276 240 C276 280 224 318 224 318 Z" transform="translate(-16, -10)" fill="#F43F5E" />
